name: Build and publish screening data

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screening-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build and validate complete dataset
        run: python scripts/update_dataset.py
      - uses: actions/upload-artifact@v4
        with:
          name: validated-screening-data
          path: data/
          retention-days: 14
      - name: Publish validated package to main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "vendor-screening-updater[bot]"
          git config user.email "vendor-screening-updater[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update official screening dataset"
          git push
