name: Validate official source access

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe authoritative sources
        run: python scripts/probe_sources.py
      - name: Install dynamic-source diagnostics
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Discover dynamic source structures
        run: python scripts/discover_dynamic_sources.py
